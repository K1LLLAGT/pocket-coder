[build]
  base = "website"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Static site — no server-side redirects needed for the marketing pages,
# but keep a SPA-style fallback off since this is a plain multi-page site.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
